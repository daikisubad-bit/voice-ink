<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceInk 設定</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="header">
    <div class="title">
      <span class="dot"></span>
      VoiceInk
    </div>
    <p class="subtitle">設定</p>
  </div>

  <div class="content">
    <div class="section">
      <label class="label">Groq APIキー <span class="hint">（文字起こし）</span></label>
      <input id="groq-key" type="password" placeholder="gsk_..." class="input" autocomplete="off" />
    </div>

    <div class="section">
      <label class="label">Anthropic APIキー <span class="hint">（AI整形）</span></label>
      <input id="claude-key" type="password" placeholder="sk-ant-..." class="input" autocomplete="off" />
    </div>

    <div class="section">
      <div class="toggle-row">
        <div>
          <p class="toggle-label">自動挿入</p>
          <p class="toggle-desc">整形完了後、入力欄に自動挿入する</p>
        </div>
        <button id="auto-insert-toggle" class="toggle" role="switch" aria-checked="false">
          <span class="thumb"></span>
        </button>
      </div>
    </div>

    <div class="stats-box">
      <div class="stats-item">
        <p class="stats-label">🎙 合計録音時間</p>
        <p id="stats-total" class="stats-value">0分0秒</p>
      </div>
      <div class="stats-divider"></div>
      <div class="stats-item">
        <p class="stats-label">⚡ 節約した時間</p>
        <p id="stats-saved" class="stats-value">0分0秒</p>
      </div>
    </div>

    <button id="save-btn" class="save-btn">保存</button>
    <p id="saved-msg" class="saved-msg hidden">✓ 保存しました</p>

    <div class="section">
      <label class="label">辞書 <span class="hint">（文字起こしの自動修正）</span></label>
      <div id="dict-list" class="dict-list"></div>
      <div class="dict-add-row">
        <input id="dict-from" type="text" placeholder="誤認識される語" class="input dict-input" />
        <span class="dict-arrow">→</span>
        <input id="dict-to" type="text" placeholder="正しい語" class="input dict-input" />
        <button id="dict-add-btn" class="dict-add-btn">＋</button>
      </div>
      <div class="dict-io-row">
        <button id="dict-export-btn" class="dict-io-btn">書き出し</button>
        <label class="dict-io-btn dict-import-label">
          読み込み<input id="dict-import-input" type="file" accept=".json" style="display:none" />
        </label>
      </div>
    </div>

    <p class="shortcut-hint">ショートカット: <code>Cmd+Shift+Y</code></p>
  </div>

  <script src="index.js"></script>
</body>
</html>
